[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sma_ennexos_cloud"
dynamic = ["version"]
description = "Python library for SMA ennexOS / Sunny Portal (PKCE OAuth2, no browser)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
  { name = "Mauro Druwel", email = "mauro@druwel.be" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/MauroDruwel/SMA-ennexOS-cloud"
Repository = "https://github.com/MauroDruwel/SMA-ennexOS-cloud"
Issues = "https://github.com/MauroDruwel/SMA-ennexOS-cloud/issues"

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov>=4",
  "ruff>=0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "sma_ennexos_cloud.__version__" }

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["sma_ennexos_cloud"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = false
fail_under = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
